name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure runtime secrets are not committed
        run: |
          test ! -f .env
          test ! -d .venv
          test ! -d __pycache__

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py get_yandex_token.py

      - name: Validate Dockerfile exists
        run: |
          test -f Dockerfile

      - name: Create CI env file
        run: |
          echo "DISCORD_TOKEN=dummy-discord-token" > .env
          echo "YANDEX_MUSIC_TOKEN=dummy-yandex-token" >> .env
          echo "COMMAND_PREFIX=!" >> .env
          echo "ALLOWED_USER_IDS=" >> .env
          echo "OWNER_USER_IDS=" >> .env
          echo "ALLOWED_ROLE_IDS=" >> .env
          echo "ALLOW_ALL_GUILD_MEMBERS=true" >> .env
          echo "IDLE_DISCONNECT_SECONDS=900" >> .env
          echo "PLAYLIST_QUEUE_LIMIT=50" >> .env

      - name: Validate Docker Compose config
        run: |
          docker compose config

      - name: Build Docker image
        run: |
          docker build -t musicyandexbot:ci .
